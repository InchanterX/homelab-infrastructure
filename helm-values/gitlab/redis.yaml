fullnameOverride: gitlab-redis
architecture: standalone

# Archived Bitnami image; mirror to Harbor or migrate to maintained images later.
image:
  registry: docker.io
  repository: bitnamilegacy/redis
  tag: 7.2.5-debian-12-r4

auth:
  enabled: true
  existingSecret: gitlab-redis-auth
  existingSecretPasswordKey: redis-password

master:
  persistence:
    enabled: true
    storageClass: local-path-retain
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

metrics:
  enabled: false
