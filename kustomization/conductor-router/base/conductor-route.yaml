apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: conductor-route
  namespace: orchestra
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home-gateway
      namespace: default
  hostnames:
    - conductor.faberge-eggs.ru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: conductor
          port: 80
          weight: 1
