apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: infrastructure-dev
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  isCA: true
  commonName: homelab-root-ca
  secretName: root-ca-secret
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: root-ca-issuer
    kind: ClusterIssuer