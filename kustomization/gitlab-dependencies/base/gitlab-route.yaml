apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-route
  namespace: gitlab
spec:
  parentRefs:
    - name: home-gateway
      namespace: default
      sectionName: gitlab-https
  hostnames:
    - gitlab.faberge-eggs.ru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitlab-webservice-default
          port: 8181