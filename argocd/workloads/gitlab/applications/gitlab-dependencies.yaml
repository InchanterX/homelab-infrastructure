apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-dependencies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: gitlab
  source:
    repoURL: https://github.com/InchanterX/homelab-infrastructure.git
    targetRevision: main
    path: kustomization/gitlab-dependencies/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
