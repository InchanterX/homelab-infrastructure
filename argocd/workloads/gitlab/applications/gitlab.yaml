apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: gitlab

  sources:
    - repoURL: https://charts.gitlab.io/
      chart: gitlab
      targetRevision: "10.6.1"
      helm:
        releaseName: gitlab
        valueFiles:
          - $values/helm-values/gitlab/gitlab.yaml

    - repoURL: https://github.com/InchanterX/homelab-infrastructure.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab

  info:
    - name: 'GitLab:'
      value: 'https://github.com/InchanterX/homelab-infrastructure/argocd/workloads/gitlab/applications/gitlab.yaml'

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
