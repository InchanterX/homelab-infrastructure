apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hackathon
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Project for hackathon applications managed by orchestra

  sourceNamespaces:
    - orchestra-apps

  sourceRepos:
    - '*'

  destinations:
    - server: https://kubernetes.default.svc
      namespace: 'hackathon-*'

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  namespaceResourceBlacklist:
    - group: ''
      kind: LimitRange
    - group: ''
      kind: ResourceQuota
    - group: 'networking.k8s.io'
      kind: NetworkPolicy

  orphanedResources:
    warn: true
