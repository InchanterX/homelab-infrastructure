apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conductor-router
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: infra-project

  source:
    repoURL: https://github.com/InchanterX/homelab-infrastructure.git
    targetRevision: main
    path: kustomization/conductor-router/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: orchestra

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
