apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: infra-project

  source:
    repoURL: https://github.com/InchanterX/homelab-infrastructure.git
    targetRevision: main
    path: kustomization/gateway-api/overlays/dev


  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
  info:
    - name: "Gateway:"
      value: "https://github.com/InchanterX/homelab-infrastructure/kustomization/gateway-api"